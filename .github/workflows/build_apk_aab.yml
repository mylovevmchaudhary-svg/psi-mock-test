name: Build PSI Mock Test Student & Admin APKs (Firebase Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PSI Mock Test Student & Admin Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Clean Student App Scaffolding & Google Services
        run: |
          rm -rf android
          flutter create --platforms=android --org com.psimock.test --project-name psi_mock_test .
          # Copy google-services.json into android/app
          cp google-services.json android/app/google-services.json || true
          # Copy custom PSI Mock Test 3D Emblem launcher icons
          cp -rf android_branding/mipmap-* android/app/src/main/res/
          
          # Safely configure AndroidManifest.xml (Internet permissions, Cleartext, Labels, Icons)
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application")
          if "android:usesCleartextTraffic" not in content:
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
          content = content.replace("android:icon=\"@mipmap/ic_launcher\"", "android:icon=\"@mipmap/ic_launcher\" android:roundIcon=\"@mipmap/ic_launcher_round\"")
          content = content.replace("android:label=\"psi_mock_test\"", "android:label=\"PSI Mock Test\"")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          '
          
          # Set applicationId to Com.psimock.test matching google-services.json
          python3 -c '
          import os, re
          target_file = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          if os.path.exists(target_file):
              with open(target_file, "r") as f:
                  txt = f.read()
              txt = re.sub(r"applicationId\s*=?\s*\"[^\"]*\"", "applicationId = \"Com.psimock.test\"", txt)
              with open(target_file, "w") as f:
                  f.write(txt)
          '

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Student App Dependencies
        run: flutter pub get

      - name: ⚡ Build PSI Mock Test Student Universal Release APK
        run: |
          mkdir -p build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk

      - name: 📦 Build Release AAB (App Bundle for Play Store)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab

      - name: 🎛️ Build Standalone Admin Universal Release APK
        run: |
          cd psi_mock_test_admin
          flutter create --platforms=android --org com.psimock.admin --project-name psi_mock_test_admin .
          
          # Safely configure Admin AndroidManifest.xml (Internet permissions, Cleartext, Labels, Icons)
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application")
          if "android:usesCleartextTraffic" not in content:
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
          content = content.replace("android:icon=\"@mipmap/ic_launcher\"", "android:icon=\"@mipmap/ic_launcher\" android:roundIcon=\"@mipmap/ic_launcher_round\"")
          content = content.replace("android:label=\"psi_mock_test_admin\"", "android:label=\"PSI Mock Test Admin\"")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          '
          
          cp -rf ../android_branding/mipmap-* android/app/src/main/res/
          flutter pub get
          mkdir -p ../build/symbols
          flutter build apk --release --obfuscate --split-debug-info=../build/symbols
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
          cd ..

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-latest
          name: "PSI Mock Test & Admin Console v1.0.0 (Firebase Universal Edition)"
          body: |
            ## 👮‍♂️ PSI Mock Test Platform (Constable & PSI Edition) - v1.0.0 (Firebase Universal)
            
            ### 📥 Download Android Applications:
            - 📱 **Student Mobile App (Universal APK - Installs on all Android phones):** [PSI_Mock_Test_Student_App.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-latest/PSI_Mock_Test_Student_App.apk)
            - 🎛️ **Dedicated Admin App (Universal APK - Installs on all Android phones):** [PSI_Mock_Test_Admin_App.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-latest/PSI_Mock_Test_Admin_App.apk)
            - 📦 **Play Store AAB Bundle:** [PSI_Mock_Test_Student_App.aab](https://github.com/${{ github.repository }}/releases/download/v1.0.0-latest/PSI_Mock_Test_Student_App.aab)
            
            ### 🚀 Highlights of v1.0.0 Firebase Edition:
            - 🔥 **Firebase Project Connected:** `psimocktest` (Package: `Com.psimock.test`)
            - 🌐 **100% Universal Compatibility:** Includes arm64, armeabi-v7a, and x86_64 binaries with full internet permissions.
            - 🎯 **100% Dynamic Mock Tests:** ZERO pre-loaded tests or questions. All tests and questions load directly from Firebase Firestore.
            - 📄 **Single PDF-Style Question Paper:** 1 complete 200-question paper, timer, and 1-200 palette (No Part A / Part B split).
            - 📚 **Official Syllabus Master:** Exact official syllabus for Gujarat Police PSI (Paper 1) and LRD / Constable with idempotent Firestore seeding.
            - 📊 **17-Column CSV/Excel Import:** Central MCQ Bank with SHA-256 deduplication and full pre-import validation.
            - 👤 **Robust Firebase Authentication:** Clean error messages in Gujarati and decoupled profile management.
            - 💰 **Wallet, Referrals & Rewards:** Welcome bonus, referral bonus, daily check-in, and withdrawal requests.
            - 🎨 **Original Design & Features:** 100% preserved UI, colors, layout, and Gujarati language strings.
          files: |
            build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
            build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
            build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab
